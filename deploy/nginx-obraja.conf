# ObraJá — Nginx config
# Substitua SEU_DOMINIO pelo domínio real (ex: obraja.com.br)
# Copiar para: /etc/nginx/sites-available/obraja
# Depois: ln -s /etc/nginx/sites-available/obraja /etc/nginx/sites-enabled/
# Depois: certbot --nginx -d SEU_DOMINIO -d loja.SEU_DOMINIO -d admin.SEU_DOMINIO -d api.SEU_DOMINIO

# ─── Consumidor (raiz do domínio) ─────────────────────────────────────────────
server {
    listen 80;
    server_name SEU_DOMINIO www.SEU_DOMINIO;

    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── Painel da Loja ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name loja.SEU_DOMINIO;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── Painel Admin ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.SEU_DOMINIO;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── API NestJS ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.SEU_DOMINIO;

    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ObraJá — Nginx config para divixstudio.io
# Copiar para: /etc/nginx/sites-available/obraja
# Depois: ln -s /etc/nginx/sites-available/obraja /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d loja.divixstudio.io -d admin.divixstudio.io -d api.divixstudio.io

# ─── App do Consumidor ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name loja.divixstudio.io;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── Painel Admin ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.divixstudio.io;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── API NestJS ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.divixstudio.io;

    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.97.173.136
          username: root
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /var/www/obraja

            echo "Pulling latest code..."
            git fetch origin main
            git checkout -- .
            git clean -f
            git pull origin main

            echo "Installing dependencies..."
            pnpm install

            echo "Building API..."
            cd packages/api && npx nest build && cd /var/www/obraja

            echo "Building web-customer..."
            cd apps/web-customer && npm run build && cd /var/www/obraja

            echo "Building web-seller..."
            cd apps/web-seller && npm run build && cd /var/www/obraja

            echo "Building web-admin..."
            cd apps/web-admin && npm run build && cd /var/www/obraja

            echo "Restarting PM2..."
            pm2 reload ecosystem.config.js --update-env
            pm2 save

            echo "Deploy concluido!"
            pm2 status

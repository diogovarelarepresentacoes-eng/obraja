name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.97.173.136
          username: root
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /var/www/obraja

            echo "Pulling latest code..."
            git fetch origin main
            git checkout -- .
            git clean -f
            git pull origin main

            echo "Installing dependencies..."
            pnpm install || echo "[WARN] pnpm exited with $? (ERR_PNPM_IGNORED_BUILDS ignorado)"
            pnpm rebuild bcrypt sharp msgpackr-extract unrs-resolver 2>/dev/null || true

            echo "Building API..."
            cd packages/api && npx nest build && cd /var/www/obraja

            echo "Building web-customer..."
            cd apps/web-customer && npm run build && cd /var/www/obraja

            echo "Building web-seller..."
            cd apps/web-seller && npm run build && cd /var/www/obraja

            echo "Building web-admin..."
            cd apps/web-admin && npm run build && cd /var/www/obraja

            echo "Restarting PM2..."
            pm2 reload ecosystem.config.js --update-env
            pm2 save

            echo "Deploy concluido!"
            pm2 status

            echo "=== Logs obraja-seller ==="
            pm2 logs obraja-seller --lines 20 --nostream 2>&1 | tail -20 || true

            echo "=== Logs obraja-admin ==="
            pm2 logs obraja-admin --lines 20 --nostream 2>&1 | tail -20 || true

            echo "=== Logs obraja-customer ==="
            pm2 logs obraja-customer --lines 20 --nostream 2>&1 | tail -20 || true

            echo "=== ecosystem.config.js ==="
            cat /var/www/obraja/ecosystem.config.js 2>/dev/null || echo "NAO ENCONTRADO"
